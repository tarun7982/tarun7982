<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#111b2e">
        <animate attributeName="stop-color" values="#111b2e;#1a1433;#0f2a3a;#111b2e" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="type">
      <rect x="278" y="168" width="0" height="34">
        <animate attributeName="width" from="0" to="460" dur="2.6s" begin="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <circle cx="180" cy="70" r="70" fill="#58a6ff" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="180;300;180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="190" r="80" fill="#a371f7" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cy" values="190;110;190" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Courier New',monospace" font-size="22" fill="#58a6ff">
      <text x="90" y="210" opacity="0.25">&lt;/&gt;
        <animate attributeName="y" values="210;190;210" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="880" y="70" opacity="0.25" fill="#a371f7">{ }
        <animate attributeName="y" values="70;90;70" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="160" y="60" opacity="0.2">=&gt;
        <animate attributeName="y" values="60;80;60" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="800" y="230" opacity="0.2" fill="#a371f7">[ ]
        <animate attributeName="y" values="230;210;230" dur="6.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="500" y="78" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" letter-spacing="6" fill="#8b949e" opacity="0">
      HELLO, WORLD
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    </text>

    <text x="500" y="140" text-anchor="middle" font-size="60" font-weight="700" fill="url(#name)" opacity="0">
      Tarun
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1s" begin="0.5s" fill="freeze"/>
    </text>

    <text x="278" y="192" font-family="'Courier New',monospace" font-size="20" fill="#c9d1d9" clip-path="url(#type)">Frontend-leaning Full Stack Developer</text>

    <rect x="278" y="173" width="2" height="24" fill="#58a6ff">
      <animate attributeName="x" from="278" to="724" dur="2.6s" begin="1.2s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="16" fill="none" stroke="#30363d"/>
</svg>
