<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10162A"/>
      <stop offset=".55" stop-color="#14152D"/>
      <stop offset="1" stop-color="#10252D"/>
    </linearGradient>
    <linearGradient id="title" x1="390" y1="125" x2="760" y2="210" gradientUnits="userSpaceOnUse">
