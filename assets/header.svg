<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101525"/>
      <stop offset=".52" stop-color="#17172D"/>
      <stop offset="1" stop-color="#10252D"/>
    </linearGradient>
    <linearGradient id="glass" x1="72" y1="34" x2="1104" y2="325" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".105"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".035"/>
      <stop offset="1" stop-color="#7AE8D7" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="name" x1="105" y1="120" x2="475" y2="193" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6A9FF"/>
      <stop offset="1" stop-color="#67E2CF"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 196 -260 0 138 67)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8979FF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8979FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 177 -273 0 1060 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D3BE" stop-opacity=".19"/>
      <stop offset="1" stop-color="#39D3BE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
