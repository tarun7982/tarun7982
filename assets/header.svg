    <circle cx="139" cy="68" r="95" fill="#8979FF" fill-opacity=".26" filter="url(#blur)">
      <animate attributeName="cy" values="68;103;68" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1061" cy="261" r="100" fill="#39D3BE" fill-opacity=".2" filter="url(#blur)">
      <animate attributeName="cy" values="261;225;261" dur="14s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 64h1200M0 296h1200" stroke="#FFFFFF" stroke-opacity=".035"/>
    <rect x="22" y="22" width="1156" height="316" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".2"/>
    <path d="M44 23h1112" stroke="#FFFFFF" stroke-opacity=".25" stroke-linecap="round"/>
    <circle cx="1150" cy="47" r="3" fill="#FFFFFF" fill-opacity=".6"/>
    <circle cx="1135" cy="47" r="3" fill="#FFFFFF" fill-opacity=".28"/>

    <text x="76" y="96" fill="#AEB7CC" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="72" y="170" fill="url(#name)" font-family="Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Tarun</text>
    <text x="76" y="211" fill="#EDF1FA" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="550">Frontend-leaning Full Stack Developer</text>
    <text x="76" y="246" fill="#AEB7CC" font-family="Segoe UI,Arial,sans-serif" font-size="15">I build polished interfaces and practical products across the stack.</text>

    <g transform="translate(76 273)" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".7">
      <rect width="136" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".2"/>
      <circle cx="18" cy="17" r="4" fill="#A99EFF"/>
      <text x="31" y="21" fill="#D9D3FF">UI ENGINEERING</text>
      <rect x="148" width="153" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".2"/>
      <circle cx="166" cy="17" r="4" fill="#68DCC8"/>
      <text x="179" y="21" fill="#C5F5EF">FULL STACK</text>
    </g>

    <g transform="translate(760 70)">
      <rect x="0" y="0" width="350" height="220" rx="20" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".2"/>
      <path d="M20 1h310" stroke="#FFFFFF" stroke-opacity=".25" stroke-linecap="round"/>
      <rect x="24" y="27" width="302" height="166" rx="13" fill="#0C1321" fill-opacity=".48" stroke="#FFFFFF" stroke-opacity=".12"/>
      <rect x="42" y="46" width="62" height="128" rx="9" fill="#9E91FF" fill-opacity=".17" stroke="#B6ABFF" stroke-opacity=".25"/>
      <path d="M57 71h30M57 86h20M57 101h27" stroke="#C9C0FF" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="72" cy="146" r="12" fill="#B2A7FF" fill-opacity=".8"/>
      <rect x="123" y="47" width="177" height="52" rx="10" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".14"/>
      <rect x="140" y="63" width="76" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".78"/>
      <rect x="140" y="78" width="130" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".23"/>
      <rect x="123" y="111" width="177" height="63" rx="10" fill="#39D3BE" fill-opacity=".075" stroke="#68DCC8" stroke-opacity=".19"/>
      <path d="M141 155c17-17 26-11 38-25 11-14 25 6 36-4 9-9 20-9 38-23" stroke="#68DCC8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="178" cy="130" r="4" fill="#B2FFF1"/>
      <circle cx="215" cy="126" r="4" fill="#B2FFF1"/>
      <circle cx="253" cy="103" r="4" fill="#B2FFF1"/>
      <text x="24" y="215" fill="#AEB7CC" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" letter-spacing="1.5">DESIGN  ·  BUILD  ·  REFINE</text>
    </g>
