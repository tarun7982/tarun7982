      <stop stop-color="#131927"/>
      <stop offset="1" stop-color="#101A22"/>
    </linearGradient>
    <linearGradient id="line" x1="96" y1="191" x2="906" y2="191" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7BFF"/>
