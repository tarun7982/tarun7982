    <path d="M0 49h1000" stroke="#FFFFFF" stroke-opacity=".09"/>
    <path d="M0 1h1000v48H0z" fill="#FFFFFF" fill-opacity=".035"/>
    <circle cx="27" cy="25" r="6" fill="#FF716A"/>
    <circle cx="48" cy="25" r="6" fill="#F5C45E"/>
    <circle cx="69" cy="25" r="6" fill="#48C99A"/>
    <text x="500" y="30" text-anchor="middle" fill="#9AA6BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">a little about my work</text>
    <text x="52" y="91" fill="#38D6C3" font-family="Consolas,monospace" font-size="15">$</text>
    <text x="75" y="91" fill="#E5E9F2" font-family="Consolas,monospace" font-size="15">I love building thoughtful digital experiences.</text>
    <text x="52" y="128" fill="#38D6C3" font-family="Consolas,monospace" font-size="15">$</text>
    <text x="75" y="128" fill="#E5E9F2" font-family="Consolas,monospace" font-size="15">From expressive interfaces to useful full-stack apps.</text>
    <text x="52" y="165" fill="#38D6C3" font-family="Consolas,monospace" font-size="15">$</text>
    <text x="75" y="165" fill="#E5E9F2" font-family="Consolas,monospace" font-size="15">Always learning, refining, and shipping.</text>
