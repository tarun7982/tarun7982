<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" fill="none">
  <defs>
    <linearGradient id="line" x1="0" y1="4" x2="1000" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7BFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#38D6C3" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="3" width="998" height="2" rx="1" fill="#FFFFFF" fill-opacity=".08"/>
  <rect x="1" y="3" width="998" height="2" rx="1" fill="url(#line)"/>
</svg>
