<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10" fill="none">
  <defs>
    <linearGradient id="line" x1="0" y1="5" x2="1000" y2="5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9E91FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A99EFF"/>
      <stop offset="1" stop-color="#42D2BB" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="4" width="998" height="2" rx="1" fill="#FFFFFF" fill-opacity=".08"/>
  <rect x="1" y="4" width="998" height="2" rx="1" fill="url(#line)"/>
</svg>
